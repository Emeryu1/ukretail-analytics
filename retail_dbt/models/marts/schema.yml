version: 2

models:
  - name: fct_monthly_revenue
    description: Monthly revenue, orders and customers by country
    columns:
      - name: revenue_month
        data_tests:
          - not_null
      - name: total_revenue
        data_tests:
          - not_null

  - name: fct_product_performance
    description: Sales performance aggregated per product
    columns:
      - name: stock_code
        data_tests:
          - not_null
          - unique
      - name: total_revenue
        data_tests:
          - not_null

  - name: fct_customer_rfm
    description: Customer-level RFM scores and lifecycle segments
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Champions', 'New / Promising', 'At Risk', 'Lost', 'Regular']